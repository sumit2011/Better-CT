<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Execution Details</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    background:linear-gradient(135deg,#f5f7fa,#e4ecfb);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
}

.container{
    width:100%;
    max-width:750px;
    background:#fff;
    border-radius:20px;
    padding:35px;
    box-shadow:0 15px 40px rgba(0,0,0,0.08);
}

.header{
    text-align:center;
    margin-bottom:30px;
}

.header h1{
    color:#1976d2;
    font-size:28px;
    font-weight:700;
}

.header p{
    color:#666;
    margin-top:8px;
    font-size:14px;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.form-group{
    display:flex;
    flex-direction:column;
}

.form-group.full-width{
    grid-column:span 2;
}

label{
    font-size:14px;
    font-weight:600;
    color:#333;
    margin-bottom:8px;
}

input,select{
    height:48px;
    border:1px solid #dce3ef;
    border-radius:10px;
    padding:0 15px;
    font-size:14px;
    background:#fafbfc;
    transition:all .3s ease;
}

input:focus,
select:focus{
    outline:none;
    border-color:#1976d2;
    background:#fff;
    box-shadow:0 0 0 4px rgba(25,118,210,.12);
}

.info-box{
    margin-top:25px;
    padding:15px;
    border-radius:10px;
    background:#f4f8ff;
    border-left:4px solid #1976d2;
    color:#555;
    font-size:13px;
}

.btn-container{
    text-align:center;
    margin-top:30px;
}

button{
    background:linear-gradient(135deg,#1976d2,#1565c0);
    color:white;
    border:none;
    border-radius:12px;
    padding:14px 35px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition:all .3s ease;
    box-shadow:0 8px 20px rgba(25,118,210,.25);
}

button:hover{
    transform:translateY(-2px);
    box-shadow:0 12px 24px rgba(25,118,210,.35);
}

button:active{
    transform:translateY(0);
}

.status-passed{
    color:#2e7d32;
}

.status-failed{
    color:#d32f2f;
}

@media(max-width:768px){

    .container{
        padding:25px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .form-group.full-width{
        grid-column:span 1;
    }

    button{
        width:100%;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🧪 Test Execution Details</h1>
        <p>Provide execution information to generate a professional test report.</p>
    </div>

    <form>

        <div class="form-grid">

            <div class="form-group">
                <label>Test Case Name</label>
                <input id="testCaseName"
                    placeholder="Verify Login Functionality">
            </div>

            <div class="form-group">
                <label>Test Case ID</label>
                <input id="testCaseId"
                    placeholder="TC_LOGIN_001">
            </div>

            <div class="form-group">
                <label>Module</label>
                <input id="module"
                    placeholder="">
            </div>

            <div class="form-group">
                <label>Environment</label>
                <select id="environment">
                    <option>DEV</option>
                    <option>TEST</option>
                    <option>UAT</option>
                    <option>PROD</option>
                </select>
            </div>

            <div class="form-group">
                <label>Executed By</label>
                <input id="executedBy"
                    placeholder="Name">
            </div>

            <div class="form-group">
                <label>Status</label>
                <select id="status">
                    <option>✅ PASSED</option>
                    <option>❌ FAILED</option>
                </select>
            </div>

            <div class="form-group full-width">
                <label>Remarks</label>
                <input id="remarks"
                    placeholder="Execution completed successfully...">
            </div>

        </div>

        <div class="info-box">
            📋 Report will include testcase details, browser information,
            execution date/time, screenshots, and execution result summary.
        </div>

        <div class="btn-container">
            <button id="generateBtn" type="button">
                📄 Generate Test Report
            </button>
        </div>
        <div class="btn-container" style="margin-top: 10px; font-size: 12px; color: #888;">
            <p>Made with ❤️ by Sumit...</p>
        </div>

    </form>

</div>

<script src="report-form.js"></script>

</body>
</html>
